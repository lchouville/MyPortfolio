name: CI - Lint and Build

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@60a7960c89d57d591ebea3bfa08c17f1d4f26169
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript and HTML
        run: npm run lint

      - name: Validate build
        run: npm run build
